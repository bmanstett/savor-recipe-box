    <nav><a href="/">Home</a> <a href="/recipes">Recipes</a></nav>
    <div class="recipe" itemscope itemtype="https://schema.org/Recipe">
      <div class="title" itemprop="name">Shaved Carrot Ribbon Salad</div>
      <div class="yield-meta" itemprop="recipeYield" style="display: none;">4 servings</div>
      <meta itemprop="prepTime" content="PT15M">
      <time itemprop="totalTime" datetime="PT20M">20 minutes</time>
      <img itemprop="image" src="/images/carrot-salad.jpg" alt="Carrot ribbon salad in a bowl">
      <span itemprop="author" itemscope itemtype="https://schema.org/Person"><span itemprop="name">Fixture Cook</span></span>
      <ul class="ingredients">
        <li class="ingredient" itemprop="recipeIngredient"><label><input name="ingredients" type="checkbox" value="1 lb carrots, peeled into ribbons"><p>1 lb carrots, peeled into ribbons</p></label></li>
        <li class="ingredient" itemprop="recipeIngredient"><label><input name="ingredients" type="checkbox" value="Big handful cilantro, chopped"><p>Big handful cilantro, chopped</p></label></li>
        <li class="ingredient" itemprop="recipeIngredient"><label><input name="ingredients" type="checkbox" value="2 Tbsp olive oil"><p>2 Tbsp olive oil</p></label></li>
        <li class="ingredient" itemprop="recipeIngredient"><label><input name="ingredients" type="checkbox" value="1 lime, juiced"><p>1 lime, juiced</p></label></li>
        <li class="ingredient" itemprop="recipeIngredient"><label><input name="ingredients" type="checkbox" value="1/2 tsp salt"><p>1/2 tsp salt</p></label></li>
      </ul>
      <ol class="steps" itemprop="recipeInstructions"><li><p>Put everything in a large mixing bowl and toss until combined.</p></li><li><p>Massage the salad until the salt dissolves.</p></li><li><p>Store in the fridge for up to 4 days.</p></li></ol>
